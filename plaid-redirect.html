<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chaisha</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f9fafb;
      color: #111;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      max-width: 420px;
      margin: 24px;
      padding: 40px 32px;
      text-align: center;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #12B76A;
      margin-bottom: 12px;
    }
    p {
      font-size: 15px;
      color: #555;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    a.button {
      display: inline-block;
      background: #12B76A;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      padding: 14px 28px;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Returning to Chaisha</h1>
    <p>Your bank connection is finishing up. If the Chaisha app didn't open automatically, tap below to return.</p>
    <a class="button" href="chaisha://">Open Chaisha</a>
  </div>
</body>
</html>
